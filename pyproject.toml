[project]
name = "qorder-api"
version = "0.1.0"
description = "QOrder — multi-tenant QR ordering system for restaurants/bars"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "redis>=5.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "apscheduler>=3.11.0",
]

[project.optional-dependencies]
# Installed later as their tasks land; kept here so the intent is documented.
printing = ["python-escpos>=3.1", "weasyprint>=63.0"]
reporting = ["gspread>=6.1.4"]
qr = ["qrcode[pil]>=8.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "fakeredis>=2.26.0",
    "hypothesis>=6.122.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qorder_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
