services:
  postgres:
    image: postgres:16-alpine
    container_name: qorder-postgres
    environment:
      POSTGRES_USER: qorder
      POSTGRES_PASSWORD: qorder
      POSTGRES_DB: qorder
    ports:
      - "5432:5432"
    volumes:
      - qorder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qorder -d qorder"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qorder-redis
    ports:
      - "6379:6379"
    volumes:
      - qorder_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  qorder_pgdata:
  qorder_redisdata:
