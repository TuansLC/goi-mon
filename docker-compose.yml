services:
  postgres:
    image: postgres:16-alpine
    container_name: qorder-postgres
    environment:
      POSTGRES_USER: qorder
      POSTGRES_PASSWORD: qorder
      POSTGRES_DB: qorder
    ports:
      - "5432:5432"
    volumes:
      - qorder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qorder -d qorder"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qorder-redis
    ports:
      - "6379:6379"
    volumes:
      - qorder_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: qorder-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - qorder_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  qorder_pgdata:
  qorder_redisdata:
  qorder_miniodata:
